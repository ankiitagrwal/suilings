# Railway configuration for compilation service
# This file should be at repository root

[build]
builder = "DOCKERFILE"
# Using prebuilt Dockerfile for faster builds (< 5 min vs 30-60 min)
# To use build-from-source, change to: suilings-web/compilation-service/Dockerfile
dockerfilePath = "suilings-web/compilation-service/Dockerfile.prebuilt"
# Build context is the repository root (where this file is)
watchPatterns = ["suilings-web/compilation-service/**", "runner-crate/**"]

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

